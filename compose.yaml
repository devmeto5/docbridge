services:
  docbridge:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DOCBRIDGE_API_KEY: ${DOCBRIDGE_API_KEY:?Run setup.sh or configure .env first}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
